<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SBSC 업무 접수</title>
<meta name="theme-color" content="#b8845a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SBSC" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif; background: #f7f4ec; }
.app { min-height: 100vh; max-width: 480px; margin: 0 auto; color: #2a271f; }
header { padding: 20px 18px 14px; background: #fffdf9; border-bottom: 1px solid #eae4d4; position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.brand-mark { height: 34px; padding: 0 10px; border-radius: 9px; background: #b8845a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; letter-spacing: 0.03em; flex-shrink: 0; }
.brand-title { font-size: 16px; font-weight: 700; }
.brand-sub { font-size: 12px; color: #8a8578; margin-top: 1px; }
.tabs { display: flex; gap: 6px; background: #f0eee2; border-radius: 10px; padding: 4px; }
.tabs button { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: #8a8578; cursor: pointer; }
.tabs button.active { background: #fff; color: #2a271f; box-shadow: 0 1px 3px rgba(40,35,20,0.1); }
main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card { background: #fffdf9; border: 1px solid #eae4d4; border-radius: 14px; padding: 16px; }
.form-card { display: flex; flex-direction: column; gap: 14px; }
.field { position: relative; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.field-row { display: flex; gap: 10px; }
label { font-size: 12px; font-weight: 600; color: #6b6558; letter-spacing: 0.02em; }
input, textarea, select { border: 1.5px solid #ded8c9; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: inherit; background: #fffdf9; color: #2a271f; outline: none; transition: border-color 0.15s ease; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: #b8845a; }
textarea { resize: vertical; }
select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238a8578' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
@media (max-width: 360px) { .field-row { flex-direction: column; gap: 14px; } }
.suggest { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid #e5e0d4; border-radius: 10px; box-shadow: 0 8px 20px rgba(40,35,20,0.1); overflow: hidden; z-index: 10; }
.suggest-item { padding: 10px 14px; font-size: 14px; cursor: pointer; color: #3a362b; }
.suggest-item:hover { background: #f5f1e6; }
.submit-btn { border: none; background: #b8845a; color: #fff; font-size: 14.5px; font-weight: 700; padding: 13px; border-radius: 10px; cursor: pointer; margin-top: 2px; width: 100%; }
.submit-btn:disabled { background: #ddd6c6; cursor: not-allowed; }
.recent-title { font-size: 12px; font-weight: 700; color: #8a8578; margin-bottom: 10px; letter-spacing: 0.02em; }
.recent-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #f0eee2; font-size: 13px; }
.recent-row:first-of-type { border-top: none; }
.recent-company { font-weight: 600; flex: 1; }
.recent-type { color: #8a8578; }
.recent-date { color: #b3ac9a; font-size: 12px; }
.pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border-radius: 12px; padding: 12px 6px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 800; }
.stat-label { font-size: 11.5px; color: #6b6558; margin-top: 2px; }
.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-card { background: #fffdf9; border: 1px solid #eae4d4; border-radius: 14px; padding: 14px; }
.task-top { display: flex; justify-content: space-between; align-items: flex-start; }
.task-company { font-weight: 700; font-size: 14.5px; }
.task-type { font-size: 12px; color: #b8845a; font-weight: 600; margin-top: 1px; }
.task-content { font-size: 13.5px; color: #4a4638; margin: 8px 0 10px; line-height: 1.5; }
.task-controls { display: flex; gap: 6px; align-items: center; }
select { border: 1px solid #ded8c9; border-radius: 8px; padding: 6px 8px; font-size: 12.5px; background: #fff; color: #2a271f; }
.task-date { margin-left: auto; font-size: 11.5px; color: #b3ac9a; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2a271f; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
</style>
</head>
<body>
<div id="root"></div>
<script src="bundle.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
